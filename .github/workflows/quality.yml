name: Quality gates

on:
  pull_request:
    paths:
      - "muscatbay/app/**"
      - ".github/workflows/quality.yml"
  push:
    branches:
      - main
    paths:
      - "muscatbay/app/**"
      - ".github/workflows/quality.yml"
  # The RLS policies decide who can read and write production data. Nothing in
  # the app changes when they rot, so a weekly run catches drift that no PR
  # would otherwise touch.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muscatbay/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: muscatbay/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build production application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public browser and accessibility tests
        run: npm run test:e2e -- --project=chromium e2e/public-accessibility.spec.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  # Applies both security migrations to a throwaway PostgreSQL cluster and
  # asserts who may read and write what. This is the only automated check that
  # exercises the RLS policies themselves: every TypeScript test mocks Supabase
  # away, so a policy could be deleted without turning a single unit test red.
  #
  # Independent of `verify` on purpose — a lint failure should not hide a
  # broken access-control policy, and vice versa.
  sql-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: muscatbay/app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 16 server binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16

      - name: Run RLS, invitation and alert-incident SQL tests
        run: npm run test:sql:local
