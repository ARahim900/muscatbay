<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Water consumption map</title>
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--color-bg, #f7f8f9);
        font: 14px/1.5 var(--map-font, ui-sans-serif, system-ui, sans-serif);
        color: var(--color-fg, #0a0a0a);
      }
      #message {
        position: absolute;
        z-index: 3;
        left: 14px;
        top: 14px;
        max-width: calc(100% - 92px);
        padding: 10px 14px;
        background: var(--color-card, #fff);
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
      }
      #message:empty {
        display: none;
      }
      html.full #message {
        top: 66px;
      }
      @media (max-width: 639px) {
        /* Full screen on a phone: the page's two map buttons can sit under the zone strip. */
        html.full #message {
          top: 118px;
        }
      }
      button:focus-visible {
        outline: 2px solid var(--color-accent, #a1d1d5);
      }
      .maplibregl-ctrl-group button {
        width: 44px;
        height: 44px;
      }
      /* Nothing on the map carries a figure: zones are named pins and a meter
         shows a name tag only when selected, when it is the zone bulk, or under
         the mouse. They take the app's card tokens, like every other control. */
      .zone-marker,
      .meter-label {
        border-radius: var(--radius-control, 6px);
        color: var(--color-fg, #0a0a0a);
        box-shadow: var(--shadow-card);
        font: inherit;
        white-space: nowrap;
      }
      /* Meter name tags stay solid — they're brief, on-demand (hover/selected)
         and read fine against the imagery without extra contrast help. */
      .meter-label {
        border: 1px solid var(--color-line, #e5e7eb);
        background: var(--color-card, #fff);
      }
      /* A meter is one small line in the colour of its band, and the further
         above its own usual it read, the longer that line. A meter that read
         nothing at all is a dot. Figures stay in the page's panels. */
      .meter-marker {
        display: block;
        padding: 6px;
        border: 0;
        background: transparent;
        line-height: 0;
        cursor: pointer;
      }
      .meter-marker.bulk { z-index: 2; }
      .meter-marker.selected { z-index: 3; }
      .meter-tick {
        display: block;
        height: 4px;
        border-radius: 999px;
        transform: scale(var(--marker-scale, 1));
        transform-origin: center;
        box-shadow:
          0 0 0 1px rgb(10 9 12 / 65%),
          0 1px 3px rgb(0 0 0 / 40%);
      }
      .meter-marker.selected .meter-tick {
        height: 6px;
        box-shadow:
          0 0 0 2px var(--color-card, #fff),
          0 1px 4px rgb(0 0 0 / 50%);
      }
      .meter-marker:focus-visible {
        outline: 3px solid var(--color-accent, #a4c5bb);
        outline-offset: 0;
        border-radius: 999px;
      }
      @media (pointer: coarse) {
        .meter-marker {
          padding: 10px;
        }
      }
      .zone-anchor {
        position: relative;
        width: 0;
        height: 0;
      }
      .zone-anchor::before {
        content: "";
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        border: 3px solid #4e4456;
        border-radius: 50%;
        background: #fff;
        box-sizing: border-box;
      }
      .zone-marker {
        position: absolute;
        min-height: 44px;
        padding: 0 14px;
        cursor: pointer;
        /* Default: centred below the point. The engine then moves the pin's name
           to whichever side of the point is free. */
        left: 0;
        top: 0;
        transform: translate(-50%, 12px);
      }
      .zone-marker b {
        font-size: 14px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgb(255 255 255 / 45%);
      }
      /* Zone names sit directly on the imagery and are read at a glance while
         panning — liquid glass, at higher opacity than the map's other glass
         chrome, keeps them legible over sand, water and buildings alike. */
      .zone-marker {
        background-color: rgb(255 255 255 / 82%);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        backdrop-filter: blur(18px) saturate(170%);
        border: 1px solid rgb(255 255 255 / 65%);
        box-shadow:
          0 1px 2px rgb(78 68 86 / 10%),
          0 8px 20px -6px rgb(78 68 86 / 32%);
      }
      .dark .zone-marker {
        background-color: rgb(22 20 27 / 82%);
        border-color: rgb(255 255 255 / 14%);
      }
      .dark .zone-marker b {
        text-shadow: 0 1px 3px rgb(0 0 0 / 55%);
      }
      .zone-marker:hover {
        border-color: var(--color-primary, #4e4456);
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .zone-marker,
        .dark .zone-marker {
          background-color: var(--color-card, #fff);
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        .zone-marker,
        .dark .zone-marker {
          background-color: var(--color-card, #fff);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }
      .meter-label {
        display: grid;
        gap: 1px;
        min-height: 32px;
        padding: 5px 10px;
        align-content: center;
        text-align: center;
        cursor: pointer;
      }
      .meter-label span {
        font-size: 13px;
        font-weight: 500;
      }
      .meter-label strong {
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .meter-label.bulk span {
        font-size: 12px;
        color: var(--color-muted, #6b7280);
      }
      .meter-label.selected {
        border-color: var(--color-primary, #4e4456);
        background: var(--color-primary, #4e4456);
        color: #fff;
        z-index: 2;
      }
      .meter-label.selected span {
        color: #fff;
        font-size: 13px;
      }
      .meter-label.hover {
        pointer-events: none;
        z-index: 3;
      }
      /* Map-side controls take the app's tokens (synced in by SatelliteMap), so
         they follow light and dark like the zoom buttons beside them. */
      /* The app's pill strip (TabNavigation): one bordered track, the chosen
         zone filled purple. One row; it scrolls sideways when zones do not fit. */
      /* Embedded, the page's Zones panel switches zone. Full screen hides that
         panel, so the strip appears there only. */
      .zone-chips {
        display: none;
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        max-width: calc(100% - 84px);
        gap: 4px;
        overflow-x: auto;
        padding: 4px;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: 12px;
        background: var(--color-card, #fff);
        box-shadow: var(--shadow-card);
        box-sizing: border-box;
        scrollbar-width: none;
      }
      html.full .zone-chips {
        display: flex;
      }
      .zone-chips::-webkit-scrollbar {
        display: none;
      }
      .zone-chip {
        flex: none;
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--color-muted, #454545);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      .zone-chip:hover {
        background: var(--color-component, #f0f2f4);
        color: var(--color-fg, #0a0a0a);
      }
      .zone-chip[aria-pressed="true"] {
        background: var(--color-primary, #4e4456);
        color: #fff;
        font-weight: 600;
      }
      .zone-chip:focus-visible {
        outline: 3px solid var(--color-accent, #a4c5bb);
        outline-offset: -3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .zone-chip {
          transition: none;
        }
      }
      .three-d-button {
        width: 44px;
        height: 44px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        line-height: 1;
        color: var(--color-fg, #0a0a0a);
      }
      .three-d-button[aria-pressed="true"] {
        background: var(--color-primary, #4e4456);
        color: #fff;
      }
      .three-d-control {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .three-d-badge {
        margin: 0;
        padding: 6px 10px;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        box-shadow: var(--shadow-card);
      }
      .three-d-badge {
        white-space: nowrap;
        font-size: 12px;
        color: var(--color-muted, #6b7280);
      }
      .three-d-badge[hidden] {
        display: none;
      }
      .meter-label:focus-visible,
      .zone-marker:focus-visible {
        outline: 3px solid #a4c5bb;
        outline-offset: 3px;
      }
      /* ── Host chrome: the app's phone map (satviz:chrome) ──
         The page draws a glass bar on top and a sheet at the bottom. The map
         drops its own zone strip and "All" button (the bar has the zone chips),
         keeps its controls between the two, and wears the same frosted glass —
         only over the imagery; solid when the viewer asks for less transparency. */
      html.host-chrome .zone-chips,
      html.host-chrome .home-button {
        display: none !important;
      }
      html.host-chrome .maplibregl-ctrl-top-right {
        top: calc(var(--chrome-top, 0px) + 4px);
      }
      html.host-chrome .maplibregl-ctrl-bottom-left,
      html.host-chrome .maplibregl-ctrl-bottom-right {
        bottom: calc(var(--chrome-bottom, 0px) + 4px);
      }
      html.host-chrome #message {
        top: calc(var(--chrome-top, 0px) + 8px);
      }
      html.host-chrome .maplibregl-ctrl-group,
      html.host-chrome .three-d-button,
      html.host-chrome .maplibregl-ctrl-attrib {
        background-color: rgb(255 255 255 / 72%);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        backdrop-filter: blur(18px) saturate(170%);
        border: 1px solid rgb(255 255 255 / 60%);
        box-shadow:
          0 1px 2px rgb(78 68 86 / 8%),
          0 8px 24px -8px rgb(78 68 86 / 28%);
      }
      html.host-chrome.dark .maplibregl-ctrl-group,
      html.host-chrome.dark .three-d-button,
      html.host-chrome.dark .maplibregl-ctrl-attrib {
        background-color: rgb(22 20 27 / 72%);
        border-color: rgb(255 255 255 / 10%);
      }
      html.host-chrome .three-d-button[aria-pressed="true"] {
        background-color: var(--color-primary, #4e4456);
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        html.host-chrome .maplibregl-ctrl-group,
        html.host-chrome .three-d-button,
        html.host-chrome .maplibregl-ctrl-attrib,
        html.host-chrome.dark .maplibregl-ctrl-group,
        html.host-chrome.dark .three-d-button,
        html.host-chrome.dark .maplibregl-ctrl-attrib {
          background-color: var(--color-card, #fff);
        }
      }
      @media (prefers-reduced-transparency: reduce) {
        html.host-chrome .maplibregl-ctrl-group,
        html.host-chrome .three-d-button,
        html.host-chrome .maplibregl-ctrl-attrib,
        html.host-chrome.dark .maplibregl-ctrl-group,
        html.host-chrome.dark .three-d-button,
        html.host-chrome.dark .maplibregl-ctrl-attrib {
          background-color: var(--color-card, #fff);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }
      /* A meter is a thumb target on touch: 44px square around the small mark. */
      @media (pointer: coarse) {
        .meter-marker {
          display: grid;
          place-items: center;
          min-width: 44px;
          min-height: 44px;
          padding: 0;
        }
      }
      .maplibregl-map {
        font: inherit;
      }
      /* Form controls do not inherit the page font by default, so every map
         button fell back to the browser's Arial. One family inside the map. */
      button,
      input,
      select {
        font-family: inherit;
      }
      .maplibregl-ctrl-group,
      .maplibregl-ctrl-attrib,
      .maplibregl-ctrl-attrib.maplibregl-compact {
        background-color: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        border-radius: var(--radius-control, 6px);
        box-shadow: var(--shadow-card);
      }
      .maplibregl-ctrl-attrib a {
        color: inherit;
      }
      .maplibregl-ctrl-group button + button {
        border-color: var(--color-line, #e5e7eb);
      }
      .dark .maplibregl-ctrl-icon,
      .dark .maplibregl-ctrl-attrib-button {
        filter: invert(1);
      }
      .maplibregl-ctrl-group button:hover {
        background-color: var(--color-component, #f0f2f4);
      }
      .maplibregl-ctrl-attrib {
        font-size: 12px;
      }
      .compat-map {
        position: relative;
        overflow: hidden;
        touch-action: none;
      }
      .compat-scene,
      .compat-imagery,
      .compat-network,
      .compat-markers {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .compat-scene {
        will-change: transform;
      }
      .compat-imagery {
        overflow: hidden;
        filter: saturate(0.75);
      }
      .compat-imagery-tile {
        position: absolute;
        display: block;
        max-width: none;
      }
      .compat-network,
      .compat-markers {
        pointer-events: none;
      }
      .compat-network polyline {
        fill: none;
        vector-effect: non-scaling-stroke;
      }
      .compat-network-case {
        stroke: #4e4456;
        stroke-width: 5;
      }
      .compat-network-line,
      .compat-fm-line {
        stroke: #6b9ac4;
        stroke-width: 2.5;
      }
      .compat-fm-line {
        stroke-dasharray: 6 6;
      }
      .compat-markers button {
        position: absolute;
        pointer-events: auto;
      }
      .compat-meter-point {
        /* The compatibility map is the touch path: keep a finger-sized target
           around a mark this small. */
        padding: 10px;
      }
      .compat-meter-card {
        position: absolute;
        pointer-events: none;
      }
      .compat-controls {
        position: absolute;
        z-index: 4;
        top: 14px;
        right: 14px;
        display: grid;
        overflow: hidden;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
      }
      .compat-controls button {
        width: 44px;
        height: 44px;
        border: 0;
        background: transparent;
        color: var(--color-fg, #0a0a0a);
        font: 600 24px/1 var(--map-font, ui-sans-serif, system-ui, sans-serif);
      }
      .compat-controls button + button {
        border-top: 1px solid var(--color-line, #e5e7eb);
      }
      html.host-chrome .compat-controls {
        top: calc(var(--chrome-top, 0px) + 14px);
      }
      html.host-chrome .compat-attribution {
        bottom: calc(var(--chrome-bottom, 0px) + 6px);
      }
      /* Little map left between the bar and the sheet: the controls lie in a
         row so they never run into the imagery credit. */
      html.host-chrome.tight-chrome .maplibregl-ctrl-top-right {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 10px;
      }
      html.host-chrome.tight-chrome .maplibregl-ctrl-top-right > .maplibregl-ctrl {
        float: none;
        clear: none;
        margin: 0;
      }
      html.host-chrome.tight-chrome .maplibregl-ctrl-top-right .maplibregl-ctrl-group {
        display: flex;
      }
      html.host-chrome.tight-chrome .maplibregl-ctrl-top-right button + button,
      html.host-chrome.tight-chrome .compat-controls button + button {
        border-top: 0;
        border-left: 1px solid var(--color-line, #e5e7eb);
      }
      html.host-chrome.tight-chrome .three-d-control {
        flex-direction: row-reverse;
        align-items: center;
      }
      html.host-chrome.tight-chrome .three-d-badge {
        max-width: 110px;
        padding: 4px 6px;
        white-space: normal;
      }
      html.host-chrome.tight-chrome .compat-controls {
        display: flex;
      }
      .compat-attribution {
        position: absolute;
        z-index: 4;
        right: 8px;
        bottom: 6px;
        padding: 2px 5px;
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-muted, #454545);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Satellite map"></div>
    <div id="message" role="status">Preparing map…</div>
    <script src="vendor/maplibre-gl.js"></script>
    <script src="data/plots-geo.js"></script>
    <script src="data/assets.js"></script>
    <script src="data/network.js"></script>
    <script src="data/network-road-corrections.js"></script>
    <script src="data/zone-fm-network.js"></script>
    <script src="data/network-service-zones.js"></script>
    <script src="data/villa-buildings.js?v=1"></script>
    <script src="network-context.js"></script>
    <script src="consumption-fallback.js?v=28"></script>
    <script src="consumption-engine.js?v=34"></script>
  </body>
</html>
