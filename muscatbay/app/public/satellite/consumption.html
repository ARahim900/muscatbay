<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Water consumption map</title>
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--color-bg, #f7f8f9);
        font: 14px/1.5 var(--map-font, ui-sans-serif, system-ui, sans-serif);
        color: var(--color-fg, #0a0a0a);
      }
      #message {
        position: absolute;
        z-index: 3;
        left: 14px;
        top: 66px;
        max-width: calc(100% - 92px);
        padding: 10px 14px;
        background: var(--color-card, #fff);
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
      }
      #message:empty {
        display: none;
      }
      @media (max-width: 639px) {
        /* On a phone the page's two map buttons can sit under the zone strip. */
        #message {
          top: 118px;
        }
      }
      button:focus-visible {
        outline: 2px solid var(--color-accent, #a1d1d5);
      }
      .maplibregl-ctrl-group button {
        width: 44px;
        height: 44px;
      }
      .zone-marker,
      .meter-label {
        min-height: 44px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 10.5px;
        /* Near-black (the app's dark page colour): figures read clearly over
           sand, sea and roofs alike. */
        background: #0a090c;
        color: #fff;
        box-shadow: 0 2px 8px rgb(0 0 0 / 35%);
        font: inherit;
        cursor: pointer;
      }
      /* A zone marker is a point with a card hung off one side of it; the
         engine picks a free side so zone cards never overlap. */
      .zone-anchor {
        position: relative;
        width: 0;
        height: 0;
      }
      .zone-anchor::before {
        content: "";
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        border: 3px solid #4e4456;
        border-radius: 50%;
        background: #fff;
        box-sizing: border-box;
      }
      .zone-marker {
        position: absolute;
        min-width: 44px;
        padding: 8px 12px;
        text-align: left;
        white-space: nowrap;
        /* Default: centred below the point. The engine then moves the card to
           whichever side of the point is free. */
        left: 0;
        top: 0;
        transform: translate(-50%, 12px);
      }
      .zone-marker b {
        display: block;
        font-size: 14px;
        font-weight: 600;
      }
      .zone-marker strong {
        display: block;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        color: #a4c5bb;
      }
      .zone-marker span,
      .zone-marker i {
        display: block;
        font-size: 12px;
        font-style: normal;
      }
      /* Loss against the Daily report's scale: a dot and the word, never colour alone. */
      .zone-marker i::before,
      .meter-label i::before {
        content: "";
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 50%;
        background: #6b7280;
      }
      .zone-marker i[data-severity="good"]::before {
        background: #84b59f;
      }
      .zone-marker i[data-severity="moderate"]::before {
        background: var(--color-warning, #e8c064);
      }
      .zone-marker i[data-severity="high"]::before,
      .zone-marker i[data-severity="critical"]::before {
        background: var(--color-danger, #d67a7a);
      }
      .zone-marker.compact span,
      .zone-marker.mini span,
      .zone-marker.mini i {
        display: none;
      }
      .zone-marker.mini {
        min-height: 44px;
        padding: 4px 10px;
      }
      .meter-label {
        min-width: 92px;
        padding: 6px 10px;
        display: grid;
        gap: 1px;
      }
      .meter-label span {
        display: block;
        font-size: 12px;
      }
      .meter-label strong {
        display: block;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        color: #a4c5bb;
      }
      .meter-label i {
        display: block;
        font-size: 12px;
        font-style: normal;
      }
      .meter-label[data-status="high"] i::before {
        background: var(--color-danger, #d67a7a);
      }
      .meter-label[data-status="zero"] i::before {
        background: var(--color-warning, #e8c064);
      }
      .meter-label[data-status="missing"] i::before {
        background: transparent;
        border: 1.5px solid #fff;
        box-sizing: border-box;
      }
      .meter-label[data-status="high"] strong {
        color: var(--color-danger, #d67a7a);
      }
      .meter-label[data-status="zero"] strong {
        color: var(--color-warning, #e8c064);
      }
      /* Crowded zones: the label shrinks to its figure before it is hidden. A
         finding keeps its meter name — "0 m³" or "— m³" alone says nothing. */
      .meter-label.compact {
        min-width: 0;
        min-height: 32px;
        padding: 4px 8px;
      }
      .meter-label.compact span,
      .meter-label.compact i {
        display: none;
      }
      .meter-label.compact.flagged span {
        display: block;
      }
      .meter-label.compact strong {
        font-size: 14px;
      }
      /* The zone's bulk meter — water in — reads apart from the individual
         meters: white, larger, labelled, and never hidden by them. */
      .meter-label.bulk {
        min-width: 112px;
        padding: 8px 12px;
        border-color: #4e4456;
        background: #fff;
        color: #0a090c;
        z-index: 1;
      }
      .meter-label.bulk em {
        display: block;
        font-size: 12px;
        font-style: normal;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #4e4456;
      }
      .meter-label.bulk strong {
        font-size: 20px;
        color: #4e4456;
      }
      .meter-label.bulk.missing strong {
        color: #0a090c;
      }
      .meter-label.selected {
        background: #a4c5bb;
        color: #0a0a0a;
        outline: 3px solid #4e4456;
        outline-offset: 2px;
        z-index: 2;
      }
      .meter-label.selected strong,
      .meter-label.selected[data-status] strong {
        color: #0a0a0a;
      }
      .meter-label.missing strong {
        color: #fff;
      }
      .meter-label.selected.missing strong {
        color: #0a0a0a;
      }
      /* Map-side controls take the app's tokens (synced in by SatelliteMap), so
         they follow light and dark like the zoom buttons beside them. */
      /* The app's pill strip (TabNavigation): one bordered track, the chosen
         zone filled purple. One row; it scrolls sideways when zones do not fit. */
      .zone-chips {
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        max-width: calc(100% - 84px);
        display: flex;
        gap: 4px;
        overflow-x: auto;
        padding: 4px;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: 12px;
        background: var(--color-card, #fff);
        box-shadow: var(--shadow-card);
        box-sizing: border-box;
        scrollbar-width: none;
      }
      .zone-chips::-webkit-scrollbar {
        display: none;
      }
      .zone-chip {
        flex: none;
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--color-muted, #454545);
        font: 500 14px/1 inherit;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      .zone-chip:hover {
        background: var(--color-component, #f0f2f4);
        color: var(--color-fg, #0a0a0a);
      }
      .zone-chip[aria-pressed="true"] {
        background: var(--color-primary, #4e4456);
        color: #fff;
        font-weight: 600;
      }
      .zone-chip:focus-visible {
        outline: 3px solid var(--color-accent, #a4c5bb);
        outline-offset: -3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .zone-chip {
          transition: none;
        }
      }
      .three-d-button {
        width: 44px;
        height: 44px;
        font: 600 14px/1 inherit;
        color: var(--color-fg, #0a0a0a);
      }
      .three-d-button[aria-pressed="true"] {
        background: var(--color-primary, #4e4456);
        color: #fff;
      }
      .three-d-control {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .three-d-badge,
      .link-note {
        margin: 0;
        padding: 6px 10px;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        box-shadow: var(--shadow-card);
      }
      .three-d-badge {
        white-space: nowrap;
        font-size: 12px;
        color: var(--color-muted, #6b7280);
      }
      .three-d-badge[hidden] {
        display: none;
      }
      .link-note {
        display: grid;
        gap: 1px;
        max-width: 260px;
        pointer-events: none;
      }
      .link-note strong {
        font-size: 14px;
      }
      .link-note span {
        font-size: 12px;
        color: var(--color-muted, #6b7280);
      }
      .meter-label:focus-visible,
      .zone-marker:focus-visible {
        outline: 3px solid #a4c5bb;
        outline-offset: 3px;
      }
      .maplibregl-map {
        font: inherit;
      }
      .maplibregl-ctrl-group,
      .maplibregl-ctrl-attrib,
      .maplibregl-ctrl-attrib.maplibregl-compact {
        background-color: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        border-radius: var(--radius-control, 6px);
        box-shadow: var(--shadow-card);
      }
      .maplibregl-ctrl-attrib a {
        color: inherit;
      }
      .maplibregl-ctrl-group button + button {
        border-color: var(--color-line, #e5e7eb);
      }
      .dark .maplibregl-ctrl-icon,
      .dark .maplibregl-ctrl-attrib-button {
        filter: invert(1);
      }
      .maplibregl-ctrl-group button:hover {
        background-color: var(--color-component, #f0f2f4);
      }
      .maplibregl-ctrl-attrib {
        font-size: 12px;
      }
      .compat-map {
        position: relative;
        overflow: hidden;
        touch-action: none;
      }
      .compat-scene,
      .compat-imagery,
      .compat-network,
      .compat-markers {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .compat-scene {
        will-change: transform;
      }
      .compat-imagery {
        overflow: hidden;
      }
      .compat-imagery-tile {
        position: absolute;
        display: block;
        max-width: none;
      }
      .compat-network,
      .compat-markers {
        pointer-events: none;
      }
      .compat-network polyline {
        fill: none;
        vector-effect: non-scaling-stroke;
      }
      .compat-network-case {
        stroke: #4e4456;
        stroke-width: 5;
      }
      .compat-network-line,
      .compat-fm-line {
        stroke: #a4c5bb;
        stroke-width: 2.5;
      }
      .compat-fm-line {
        stroke-dasharray: 6 6;
      }
      .compat-markers button {
        position: absolute;
        pointer-events: auto;
      }
      .compat-meter-point {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
      }
      .compat-meter-dot {
        display: block;
        width: 14px;
        height: 14px;
        margin: auto;
        border: 2px solid #4e4456;
        border-radius: 50%;
        background: #a4c5bb;
      }
      .compat-meter-point.missing .compat-meter-dot {
        background: var(--color-card, #fff);
      }
      .compat-meter-point[data-status="high"] .compat-meter-dot {
        background: var(--color-danger, #d67a7a);
      }
      .compat-meter-point[data-status="zero"] .compat-meter-dot {
        background: var(--color-warning, #e8c064);
      }
      .compat-meter-point.selected .compat-meter-dot {
        width: 20px;
        height: 20px;
        outline: 3px solid #4e4456;
        outline-offset: 2px;
      }
      .compat-meter-card {
        position: absolute;
        pointer-events: none;
      }
      .compat-controls {
        position: absolute;
        z-index: 4;
        top: 14px;
        right: 14px;
        display: grid;
        overflow: hidden;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
      }
      .compat-controls button {
        width: 44px;
        height: 44px;
        border: 0;
        background: transparent;
        color: var(--color-fg, #0a0a0a);
        font: 600 24px/1 var(--map-font, ui-sans-serif, system-ui, sans-serif);
      }
      .compat-controls button + button {
        border-top: 1px solid var(--color-line, #e5e7eb);
      }
      .compat-attribution {
        position: absolute;
        z-index: 4;
        right: 8px;
        bottom: 6px;
        padding: 2px 5px;
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-muted, #454545);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Satellite map"></div>
    <div id="message" role="status">Preparing map…</div>
    <script src="vendor/maplibre-gl.js"></script>
    <script src="data/plots-geo.js"></script>
    <script src="data/assets.js"></script>
    <script src="data/network.js"></script>
    <script src="data/network-road-corrections.js"></script>
    <script src="data/zone-fm-network.js"></script>
    <script src="data/network-service-zones.js"></script>
    <script src="data/villa-buildings.js?v=1"></script>
    <script src="network-context.js"></script>
    <script src="consumption-fallback.js?v=20"></script>
    <script src="consumption-engine.js?v=20"></script>
  </body>
</html>
