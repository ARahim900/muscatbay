<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Water consumption map</title>
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--color-bg, #f7f8f9);
        font: 14px/1.5 var(--map-font, ui-sans-serif, system-ui, sans-serif);
        color: var(--color-fg, #0a0a0a);
      }
      #message {
        position: absolute;
        z-index: 3;
        left: 14px;
        top: 14px;
        max-width: calc(100% - 56px);
        padding: 10px 14px;
        background: var(--color-card, #fff);
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
      }
      #message:empty {
        display: none;
      }
      button:focus-visible {
        outline: 2px solid var(--color-accent, #a1d1d5);
      }
      .maplibregl-ctrl-group button {
        width: 44px;
        height: 44px;
      }
      .zone-marker,
      .meter-label {
        min-height: 44px;
        border: 1px solid #e5e7eb;
        border-radius: 10.5px;
        background: #4e4456;
        color: #fff;
        box-shadow: 0 2px 8px rgb(0 0 0 / 24%);
        font: inherit;
        cursor: pointer;
      }
      .zone-marker {
        min-width: 44px;
        padding: 8px 12px;
      }
      .zone-marker strong {
        display: block;
        font-size: 16px;
        color: #a4c5bb;
      }
      .zone-marker span {
        display: block;
        font-size: 12px;
      }
      .meter-label {
        min-width: 92px;
        padding: 6px 10px;
        display: grid;
        gap: 1px;
      }
      .meter-label span {
        display: block;
        font-size: 12px;
      }
      .meter-label strong {
        display: block;
        font-size: 16px;
        font-variant-numeric: tabular-nums;
        color: #a4c5bb;
      }
      .meter-label.selected {
        background: #a4c5bb;
        color: #0a0a0a;
        outline: 3px solid #4e4456;
        outline-offset: 2px;
        z-index: 2;
      }
      .meter-label.selected strong {
        color: #0a0a0a;
      }
      .meter-label.missing strong {
        color: #fff;
      }
      .meter-label.selected.missing strong {
        color: #0a0a0a;
      }
      .meter-label:focus-visible,
      .zone-marker:focus-visible {
        outline: 3px solid #a4c5bb;
        outline-offset: 3px;
      }
      .maplibregl-map {
        font: inherit;
      }
      .maplibregl-ctrl-group,
      .maplibregl-ctrl-attrib,
      .maplibregl-ctrl-attrib.maplibregl-compact {
        background-color: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        border-radius: var(--radius-control, 6px);
        box-shadow: var(--shadow-card);
      }
      .maplibregl-ctrl-attrib a {
        color: inherit;
      }
      .maplibregl-ctrl-group button + button {
        border-color: var(--color-line, #e5e7eb);
      }
      .dark .maplibregl-ctrl-icon,
      .dark .maplibregl-ctrl-attrib-button {
        filter: invert(1);
      }
      .maplibregl-ctrl-group button:hover {
        background-color: var(--color-component, #f0f2f4);
      }
      .maplibregl-ctrl-attrib {
        font-size: 12px;
      }
      .compat-map {
        position: relative;
        overflow: hidden;
        touch-action: none;
      }
      .compat-scene,
      .compat-imagery,
      .compat-network,
      .compat-markers {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .compat-scene {
        will-change: transform;
      }
      .compat-imagery {
        overflow: hidden;
      }
      .compat-imagery-tile {
        position: absolute;
        display: block;
        max-width: none;
      }
      .compat-network,
      .compat-markers {
        pointer-events: none;
      }
      .compat-network polyline {
        fill: none;
        vector-effect: non-scaling-stroke;
      }
      .compat-network-case {
        stroke: #4e4456;
        stroke-width: 5;
      }
      .compat-network-line,
      .compat-fm-line {
        stroke: #a4c5bb;
        stroke-width: 2.5;
      }
      .compat-fm-line {
        stroke-dasharray: 6 6;
      }
      .compat-markers button {
        position: absolute;
        pointer-events: auto;
      }
      .compat-meter-point {
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        background: transparent;
      }
      .compat-meter-dot {
        display: block;
        width: 14px;
        height: 14px;
        margin: auto;
        border: 2px solid #4e4456;
        border-radius: 50%;
        background: #a4c5bb;
      }
      .compat-meter-point.missing .compat-meter-dot {
        background: var(--color-card, #fff);
      }
      .compat-meter-point.selected .compat-meter-dot {
        width: 20px;
        height: 20px;
        outline: 3px solid #4e4456;
        outline-offset: 2px;
      }
      .compat-meter-card {
        position: absolute;
        pointer-events: none;
      }
      .compat-controls {
        position: absolute;
        z-index: 4;
        top: 14px;
        right: 14px;
        display: grid;
        overflow: hidden;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
      }
      .compat-controls button {
        width: 44px;
        height: 44px;
        border: 0;
        background: transparent;
        color: var(--color-fg, #0a0a0a);
        font: 600 24px/1 var(--map-font, ui-sans-serif, system-ui, sans-serif);
      }
      .compat-controls button + button {
        border-top: 1px solid var(--color-line, #e5e7eb);
      }
      .compat-attribution {
        position: absolute;
        z-index: 4;
        right: 8px;
        bottom: 6px;
        padding: 2px 5px;
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-muted, #454545);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Satellite map"></div>
    <div id="message" role="status">Preparing map…</div>
    <script src="vendor/maplibre-gl.js"></script>
    <script src="data/plots-geo.js"></script>
    <script src="data/assets.js"></script>
    <script src="data/network.js"></script>
    <script src="data/network-road-corrections.js"></script>
    <script src="data/zone-fm-network.js"></script>
    <script src="data/network-service-zones.js"></script>
    <script src="network-context.js"></script>
    <script src="consumption-fallback.js?v=14"></script>
    <script src="consumption-engine.js?v=14"></script>
  </body>
</html>
