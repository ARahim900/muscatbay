<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Water consumption map</title>
    <link rel="stylesheet" href="vendor/maplibre-gl.css" />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--color-bg, #f7f8f9);
        font: 14px/1.5 var(--map-font, ui-sans-serif, system-ui, sans-serif);
        color: var(--color-fg, #0a0a0a);
      }
      #message {
        position: absolute;
        z-index: 3;
        left: 14px;
        top: 14px;
        max-width: calc(100% - 92px);
        padding: 10px 14px;
        background: var(--color-card, #fff);
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
      }
      #message:empty {
        display: none;
      }
      html.full #message {
        top: 66px;
      }
      @media (max-width: 639px) {
        /* Full screen on a phone: the page's two map buttons can sit under the zone strip. */
        html.full #message {
          top: 118px;
        }
      }
      button:focus-visible {
        outline: 2px solid var(--color-accent, #a1d1d5);
      }
      .maplibregl-ctrl-group button {
        width: 44px;
        height: 44px;
      }
      /* Nothing on the map carries a figure: zones are named pins and a meter
         shows a name tag only when selected, when it is the zone bulk, or under
         the mouse. They take the app's card tokens, like every other control. */
      .zone-marker,
      .meter-label {
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        box-shadow: var(--shadow-card);
        font: inherit;
        white-space: nowrap;
      }
      /* Every meter is the same bar: five segments light up with the day's
         share of that meter's own daily usual, in the colour of its band. */
      .meter-marker {
        display: block;
        padding: 4px;
        border: 0;
        background: transparent;
        line-height: 0;
        cursor: pointer;
      }
      .meter-marker.selected {
        z-index: 2;
      }
      .meter-bar {
        transform: scale(var(--marker-scale, 1));
        transform-origin: center;
        display: flex;
        gap: 2px;
        width: 56px;
        padding: 3px;
        border: 1px solid rgb(255 255 255 / 22%);
        border-radius: 999px;
        background: #0a090c;
        box-shadow: 0 1px 4px rgb(0 0 0 / 45%);
      }
      .meter-bar i {
        flex: 1;
        height: 10px;
        border-radius: 1px;
        background: rgb(255 255 255 / 14%);
      }
      .meter-marker.selected .meter-bar {
        border-width: 2px;
        padding: 2px;
      }
      .meter-marker:focus-visible {
        outline: 3px solid var(--color-accent, #a4c5bb);
        outline-offset: -2px;
        border-radius: 999px;
      }
      .zone-anchor {
        position: relative;
        width: 0;
        height: 0;
      }
      .zone-anchor::before {
        content: "";
        position: absolute;
        left: -6px;
        top: -6px;
        width: 12px;
        height: 12px;
        border: 3px solid #4e4456;
        border-radius: 50%;
        background: #fff;
        box-sizing: border-box;
      }
      .zone-marker {
        position: absolute;
        min-height: 44px;
        padding: 0 14px;
        cursor: pointer;
        /* Default: centred below the point. The engine then moves the pin's name
           to whichever side of the point is free. */
        left: 0;
        top: 0;
        transform: translate(-50%, 12px);
      }
      .zone-marker b {
        font-size: 14px;
        font-weight: 600;
      }
      .zone-marker:hover {
        border-color: var(--color-primary, #4e4456);
      }
      .meter-label {
        display: grid;
        gap: 1px;
        min-height: 32px;
        padding: 5px 10px;
        align-content: center;
        text-align: center;
        cursor: pointer;
      }
      .meter-label span {
        font-size: 13px;
        font-weight: 500;
      }
      .meter-label strong {
        font-size: 13px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .meter-label.bulk span {
        font-size: 12px;
        color: var(--color-muted, #6b7280);
      }
      .meter-label.selected {
        border-color: var(--color-primary, #4e4456);
        background: var(--color-primary, #4e4456);
        color: #fff;
        z-index: 2;
      }
      .meter-label.selected span {
        color: #fff;
        font-size: 13px;
      }
      .meter-label.hover {
        pointer-events: none;
        z-index: 3;
      }
      /* Map-side controls take the app's tokens (synced in by SatelliteMap), so
         they follow light and dark like the zoom buttons beside them. */
      /* The app's pill strip (TabNavigation): one bordered track, the chosen
         zone filled purple. One row; it scrolls sideways when zones do not fit. */
      /* Embedded, the page's Zones panel switches zone. Full screen hides that
         panel, so the strip appears there only. */
      .zone-chips {
        display: none;
        position: absolute;
        z-index: 3;
        top: 10px;
        left: 10px;
        max-width: calc(100% - 84px);
        gap: 4px;
        overflow-x: auto;
        padding: 4px;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: 12px;
        background: var(--color-card, #fff);
        box-shadow: var(--shadow-card);
        box-sizing: border-box;
        scrollbar-width: none;
      }
      html.full .zone-chips {
        display: flex;
      }
      .zone-chips::-webkit-scrollbar {
        display: none;
      }
      .zone-chip {
        flex: none;
        min-height: 44px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--color-muted, #454545);
        font: 500 14px/1 inherit;
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.15s ease,
          color 0.15s ease;
      }
      .zone-chip:hover {
        background: var(--color-component, #f0f2f4);
        color: var(--color-fg, #0a0a0a);
      }
      .zone-chip[aria-pressed="true"] {
        background: var(--color-primary, #4e4456);
        color: #fff;
        font-weight: 600;
      }
      .zone-chip:focus-visible {
        outline: 3px solid var(--color-accent, #a4c5bb);
        outline-offset: -3px;
      }
      @media (prefers-reduced-motion: reduce) {
        .zone-chip {
          transition: none;
        }
      }
      .three-d-button {
        width: 44px;
        height: 44px;
        font: 600 14px/1 inherit;
        color: var(--color-fg, #0a0a0a);
      }
      .three-d-button[aria-pressed="true"] {
        background: var(--color-primary, #4e4456);
        color: #fff;
      }
      .three-d-control {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .three-d-badge {
        margin: 0;
        padding: 6px 10px;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        box-shadow: var(--shadow-card);
      }
      .three-d-badge {
        white-space: nowrap;
        font-size: 12px;
        color: var(--color-muted, #6b7280);
      }
      .three-d-badge[hidden] {
        display: none;
      }
      .meter-label:focus-visible,
      .zone-marker:focus-visible {
        outline: 3px solid #a4c5bb;
        outline-offset: 3px;
      }
      .maplibregl-map {
        font: inherit;
      }
      .maplibregl-ctrl-group,
      .maplibregl-ctrl-attrib,
      .maplibregl-ctrl-attrib.maplibregl-compact {
        background-color: var(--color-card, #fff);
        color: var(--color-fg, #0a0a0a);
        border-radius: var(--radius-control, 6px);
        box-shadow: var(--shadow-card);
      }
      .maplibregl-ctrl-attrib a {
        color: inherit;
      }
      .maplibregl-ctrl-group button + button {
        border-color: var(--color-line, #e5e7eb);
      }
      .dark .maplibregl-ctrl-icon,
      .dark .maplibregl-ctrl-attrib-button {
        filter: invert(1);
      }
      .maplibregl-ctrl-group button:hover {
        background-color: var(--color-component, #f0f2f4);
      }
      .maplibregl-ctrl-attrib {
        font-size: 12px;
      }
      .compat-map {
        position: relative;
        overflow: hidden;
        touch-action: none;
      }
      .compat-scene,
      .compat-imagery,
      .compat-network,
      .compat-markers {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .compat-scene {
        will-change: transform;
      }
      .compat-imagery {
        overflow: hidden;
      }
      .compat-imagery-tile {
        position: absolute;
        display: block;
        max-width: none;
      }
      .compat-network,
      .compat-markers {
        pointer-events: none;
      }
      .compat-network polyline {
        fill: none;
        vector-effect: non-scaling-stroke;
      }
      .compat-network-case {
        stroke: #4e4456;
        stroke-width: 5;
      }
      .compat-network-line,
      .compat-fm-line {
        stroke: #a4c5bb;
        stroke-width: 2.5;
      }
      .compat-fm-line {
        stroke-dasharray: 6 6;
      }
      .compat-markers button {
        position: absolute;
        pointer-events: auto;
      }
      .compat-meter-point {
        padding: 0;
      }
      .compat-meter-card {
        position: absolute;
        pointer-events: none;
      }
      .compat-controls {
        position: absolute;
        z-index: 4;
        top: 14px;
        right: 14px;
        display: grid;
        overflow: hidden;
        border: 1px solid var(--color-line, #e5e7eb);
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
      }
      .compat-controls button {
        width: 44px;
        height: 44px;
        border: 0;
        background: transparent;
        color: var(--color-fg, #0a0a0a);
        font: 600 24px/1 var(--map-font, ui-sans-serif, system-ui, sans-serif);
      }
      .compat-controls button + button {
        border-top: 1px solid var(--color-line, #e5e7eb);
      }
      .compat-attribution {
        position: absolute;
        z-index: 4;
        right: 8px;
        bottom: 6px;
        padding: 2px 5px;
        border-radius: var(--radius-control, 6px);
        background: var(--color-card, #fff);
        color: var(--color-muted, #454545);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Satellite map"></div>
    <div id="message" role="status">Preparing map…</div>
    <script src="vendor/maplibre-gl.js"></script>
    <script src="data/plots-geo.js"></script>
    <script src="data/assets.js"></script>
    <script src="data/network.js"></script>
    <script src="data/network-road-corrections.js"></script>
    <script src="data/zone-fm-network.js"></script>
    <script src="data/network-service-zones.js"></script>
    <script src="data/villa-buildings.js?v=1"></script>
    <script src="network-context.js"></script>
    <script src="consumption-fallback.js?v=23"></script>
    <script src="consumption-engine.js?v=23"></script>
  </body>
</html>
